<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>TLINE</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="app-header">
    <h1>TLINE</h1>
    <nav id="tabs">
      <button class="tab-button active" data-tab="plan">計画</button>
      <button class="tab-button" data-tab="dispatch">運転整理</button>
      <button class="tab-button" data-tab="actual">実績</button>
    </nav>
    <div id="file-toolbar">
      <span id="current-file-label">（サンプルデータ）</span>
      <button id="btn-file-open" type="button">開く</button>
      <button id="btn-file-save" type="button" disabled>保存</button>
      <button id="btn-file-save-as" type="button">名前を付けて保存</button>
      <select id="recent-files-select">
        <option value="">最近使ったファイル…</option>
      </select>
      <button id="btn-oud-import" type="button">OuDia読み込み…</button>
    </div>
  </header>

  <div id="oud-import-panel" class="oud-import-panel hidden">
    <span id="oud-import-label"></span>
    <label>
      ダイヤ
      <select id="oud-dia-select"></select>
    </label>
    <button id="oud-dia-confirm" type="button">取り込む</button>
    <button id="oud-dia-cancel" type="button">キャンセル</button>
  </div>

  <main>
    <section id="tab-plan" class="tab-panel active">
      <h2>計画（ダイヤ）</h2>
      <p class="panel-note" id="plan-note">サンプルダイヤ（data/sampleDiagram.mjs）を表示しています。</p>
      <div class="diagram-zoom-control">
        拡大率
        <input id="plan-zoom" type="range" min="0.3" max="2" step="0.1" value="1" />
        <span id="plan-zoom-label">100%</span>
      </div>
      <div id="plan-diagram" class="diagram-container"></div>
      <div class="stop-table-scroll"><table id="plan-table" class="stop-table"></table></div>
    </section>

    <section id="tab-dispatch" class="tab-panel">
      <h2>運転整理</h2>
      <p class="panel-note">列車を選び、ある駅から先の時刻をまとめてn秒ずらします（他列車との競合チェックは未実装）。</p>
      <form id="dispatch-form" class="dispatch-form">
        <label>
          列車
          <select id="dispatch-train"></select>
        </label>
        <label>
          ずらす起点駅
          <select id="dispatch-station"></select>
        </label>
        <label>
          ずらす秒数（正=遅らせる／負=早める）
          <input id="dispatch-delta" type="number" step="1" value="90" />
        </label>
        <button type="submit">適用</button>
        <button type="button" id="dispatch-reset">リセット</button>
      </form>
      <div class="diagram-zoom-control">
        拡大率
        <input id="dispatch-zoom" type="range" min="0.3" max="2" step="0.1" value="1" />
        <span id="dispatch-zoom-label">100%</span>
      </div>
      <div id="dispatch-diagram" class="diagram-container"></div>
      <div class="stop-table-scroll"><table id="dispatch-table" class="stop-table"></table></div>
    </section>

    <section id="tab-actual" class="tab-panel">
      <h2>実績</h2>
      <p class="panel-note">計画時刻に対する実際の着発時刻を入力すると、差分（秒）を計算します。ファイル保存時に運転整理の適用状態とあわせて.tlineファイルに保存されます。</p>
      <form class="dispatch-form" id="actual-compare-form">
        <label>
          比較対象
          <select id="actual-compare-target">
            <option value="plan">計画</option>
            <option value="dispatch">運転整理後</option>
          </select>
        </label>
      </form>
      <p class="panel-note" id="actual-compare-note"></p>
      <div class="stop-table-scroll"><table id="actual-table" class="stop-table"></table></div>
    </section>
  </main>

  <script type="module" src="app.mjs"></script>
</body>
</html>
